name: Build and publish to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package JAR
        working-directory: backend
        run: bash mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build backend \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
